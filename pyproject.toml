[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "farescout"
version = "0.2.0"
description = "Community-grounded flight research with bounded flexible dates and live trace"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai]==1.107.6",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.4.0"]

[project.scripts]
farescout = "farescout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
farescout = ["ui.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
